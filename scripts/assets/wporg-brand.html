<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
	Source for the wordpress.org icon and banners, rendered by scripts/wporg-assets.mjs into .wordpress-org/:
	  ?asset=icon&t=0.25   one frame of the animated icon (t = position in the loop, 0…1)
	  ?asset=banner        the banner (static)
-->
<style>
	:root {
		--violet: #7c3aed;
		--indigo: #4f46e5;
		--night: #160f3a;
		--agent: #4f9fe8;
		--retrieval: #22c55e;
		--training: #f5b82e;
		--visitors: #c084fc;
	}
	* { box-sizing: border-box; margin: 0; }
	[hidden] { display: none !important; }
	html, body { width: 100%; height: 100%; overflow: hidden; }
	body { font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }

	/* ------------------------------------------------------------- icon */
	.icon {
		width: 100%;
		height: 100%;
		display: grid;
		place-items: center;
		background:
			radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.22), transparent 46%),
			linear-gradient(145deg, #8b5cf6 0%, #4f46e5 48%, var(--night) 100%);
	}
	.icon svg { width: 84%; height: 84%; }

	/* ----------------------------------------------------------- banner */
	.banner {
		position: relative;
		width: 100%;
		height: 100%;
		display: flex;
		align-items: center;
		gap: 4.5%;
		padding: 0 5.5%;
		background:
			radial-gradient(circle at 86% 8%, rgba(255, 255, 255, 0.16), transparent 36%),
			radial-gradient(circle at 6% 115%, rgba(79, 159, 232, 0.4), transparent 42%),
			linear-gradient(115deg, var(--night) 0%, #2e2591 52%, var(--violet) 100%);
		color: #fff;
		overflow: hidden;
	}
	/* Faint radar rings behind the copy. */
	.banner::before {
		content: "";
		position: absolute;
		left: -12vw;
		top: 50%;
		width: 64vw;
		height: 64vw;
		transform: translateY(-50%);
		border-radius: 50%;
		background: repeating-radial-gradient(circle, rgba(255, 255, 255, 0.07) 0 0.25vw, transparent 0.25vw 6vw);
		pointer-events: none;
	}
	.banner .mark { position: relative; flex: 0 0 auto; width: 14.5%; }
	.banner .mark svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 1vw 2vw rgba(0, 0, 0, 0.35)); }
	.banner .copy { position: relative; flex: 1 1 auto; }
	.banner .kicker {
		display: inline-block;
		font-size: 1.35vw;
		font-weight: 600;
		letter-spacing: 0.08em;
		text-transform: uppercase;
		color: #c7d2fe;
		margin-bottom: 0.9vw;
	}
	.banner h1 { font-size: 5vw; font-weight: 700; letter-spacing: -0.025em; line-height: 1.02; }
	.banner p { margin-top: 1.2vw; font-size: 1.95vw; opacity: 0.92; line-height: 1.35; max-width: 36vw; }
	.banner .pills { display: flex; gap: 0.8vw; margin-top: 1.6vw; }
	.banner .pills span {
		font-size: 1.25vw;
		font-weight: 600;
		padding: 0.35vw 1.1vw;
		border-radius: 999px;
		background: rgba(255, 255, 255, 0.14);
		border: 1px solid rgba(255, 255, 255, 0.22);
	}
	.banner .card {
		position: relative;
		flex: 0 0 34%;
		background: rgba(255, 255, 255, 0.97);
		color: #1d2327;
		border-radius: 1.5vw;
		padding: 1.8vw 2.1vw;
		box-shadow: 0 1.8vw 3.6vw rgba(10, 5, 40, 0.5);
	}
	.card .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1vw; }
	.card h2 { font-size: 1.4vw; font-weight: 600; color: #50575e; }
	.card .delta { font-size: 1.15vw; font-weight: 700; color: #0f7b33; background: #e7f6ec; padding: 0.15vw 0.7vw; border-radius: 999px; }
	.row { display: flex; align-items: center; gap: 1vw; margin: 0.7vw 0; font-size: 1.28vw; }
	.row b { width: 31%; font-weight: 600; white-space: nowrap; }
	.row .bar { flex: 1; height: 1.05vw; border-radius: 1vw; background: #f0f0f1; overflow: hidden; }
	.row .bar i { display: block; height: 100%; border-radius: 1vw; }
	.row span { width: 12%; text-align: right; color: #50575e; font-variant-numeric: tabular-nums; }
	.card .alert {
		margin-top: 1.1vw;
		padding: 0.7vw 0.9vw;
		border-radius: 0.8vw;
		background: linear-gradient(135deg, #eef2ff, #fdf8ee);
		border-left: 0.3vw solid var(--indigo);
		font-size: 1.15vw;
		color: #1d2327;
	}
</style>
</head>
<body>
<div class="icon" id="icon" hidden></div>

<div class="banner" id="banner" hidden>
	<div class="mark"></div>
	<div class="copy">
		<div class="kicker">AI search visibility</div>
		<h1>GEO Insights</h1>
		<p>See which AI reads your pages – and get cited by ChatGPT, Claude &amp; Perplexity.</p>
		<div class="pills"><span>100% free</span><span>No personal data</span><span>No external services</span></div>
	</div>
	<div class="card">
		<div class="head"><h2>AI accesses · 30 days</h2><span class="delta">▲ +38%</span></div>
		<div class="row"><b>Agent</b><div class="bar"><i style="width:46%;background:var(--agent)"></i></div><span>412</span></div>
		<div class="row"><b>Retrieval</b><div class="bar"><i style="width:71%;background:var(--retrieval)"></i></div><span>638</span></div>
		<div class="row"><b>Training</b><div class="bar"><i style="width:94%;background:var(--training)"></i></div><span>845</span></div>
		<div class="row"><b>AI visitors</b><div class="bar"><i style="width:24%;background:var(--violet)"></i></div><span>217</span></div>
		<div class="alert">🔔 Claude-User read your site for the first time</div>
	</div>
</div>

<script>
	const params = new URLSearchParams(location.search);
	const asset = params.get('asset') || 'banner';
	const t = Number(params.get('t') || 0.2); // Static assets show the sweep just past the agent blip.

	// Radar mark at loop position t (0…1): one full sweep per loop; each blip flares up when the beam passes it
	// and leaves an expanding ring. Angles in degrees, clockwise from 12 o'clock.
	function radar(t) {
		const sweep = (t * 360) % 360;
		const blips = [
			{ a: 42, r: 33, size: 8.5, color: 'var(--agent)' },
			{ a: 290, r: 26, size: 7.5, color: 'var(--retrieval)' },
			{ a: 158, r: 30, size: 7, color: 'var(--training)' },
		];
		const pt = (a, r) => [50 + r * Math.sin((a * Math.PI) / 180), 50 - r * Math.cos((a * Math.PI) / 180)];
		const [bx, by] = pt(sweep, 44);
		const tail = 70; // Degrees of fading trail behind the beam.
		const [tx, ty] = pt(sweep - tail, 44);
		let blipSvg = '';
		for (const b of blips) {
			const since = (sweep - b.a + 360) % 360; // Degrees since the beam passed this blip.
			const glow = Math.max(0, 1 - since / 200); // Fades over ~55% of the loop.
			const [x, y] = pt(b.a, b.r);
			const ring = since < 120 ? since / 120 : null;
			if (ring !== null) {
				blipSvg += `<circle cx="${x}" cy="${y}" r="${b.size + ring * 12}" fill="none" stroke="#fff" stroke-width="${2.2 * (1 - ring)}" stroke-opacity="${0.9 * (1 - ring)}"/>`;
			}
			blipSvg += `<circle cx="${x}" cy="${y}" r="${b.size * (1 + 0.28 * glow)}" fill="${b.color}" stroke="#fff" stroke-width="3" opacity="${0.55 + 0.45 * glow}"/>`;
		}
		return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
			<defs>
				<linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="${tx}" y1="${ty}" x2="${bx}" y2="${by}">
					<stop offset="0" stop-color="#fff" stop-opacity="0"/>
					<stop offset="1" stop-color="#fff" stop-opacity="0.5"/>
				</linearGradient>
			</defs>
			<circle cx="50" cy="50" r="44" fill="rgba(255,255,255,0.06)" stroke="#fff" stroke-opacity="0.95" stroke-width="4.5"/>
			<circle cx="50" cy="50" r="29" fill="none" stroke="#fff" stroke-opacity="0.42" stroke-width="3"/>
			<circle cx="50" cy="50" r="14" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="2.5"/>
			<path d="M50 50 L${tx} ${ty} A44 44 0 0 1 ${bx} ${by} Z" fill="url(#trail)"/>
			<line x1="50" y1="50" x2="${bx}" y2="${by}" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
			${blipSvg}
			<circle cx="50" cy="50" r="5.5" fill="#fff"/>
		</svg>`;
	}

	const target = asset === 'icon' ? document.getElementById('icon') : document.querySelector('#banner .mark');
	target.innerHTML = radar(t);
	document.getElementById(asset === 'icon' ? 'icon' : 'banner').hidden = false;
</script>
</body>
</html>
