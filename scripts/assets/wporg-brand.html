<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source for the wordpress.org icon and banners. Rendered by scripts/wporg-assets.mjs into .wordpress-org/ (?asset=icon|banner). -->
<style>
	:root {
		--violet: #7c3aed;
		--indigo: #3b2fb8;
		--blue: #2271b1;
		--night: #160f3a;
		--agent: #4f9fe8;
		--retrieval: #22c55e;
		--training: #f5b82e;
		--search: #b7bac0;
	}
	* { box-sizing: border-box; margin: 0; }
	[hidden] { display: none !important; }
	html, body { width: 100%; height: 100%; overflow: hidden; }
	body { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }

	/* ------------------------------------------------------------- icon */
	.icon {
		width: 100%;
		height: 100%;
		display: grid;
		place-items: center;
		background:
			radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.18), transparent 45%),
			linear-gradient(145deg, var(--violet) 0%, var(--indigo) 55%, var(--night) 100%);
	}
	.icon svg { width: 78%; height: 78%; }

	/* ----------------------------------------------------------- banner */
	.banner {
		position: relative;
		width: 100%;
		height: 100%;
		display: flex;
		align-items: center;
		gap: 5%;
		padding: 0 6%;
		background:
			radial-gradient(circle at 88% 15%, rgba(255, 255, 255, 0.14), transparent 38%),
			radial-gradient(circle at 10% 110%, rgba(79, 159, 232, 0.35), transparent 45%),
			linear-gradient(115deg, var(--night) 0%, var(--indigo) 55%, var(--violet) 100%);
		color: #fff;
	}
	.banner .mark { flex: 0 0 auto; width: 15%; }
	.banner .mark svg { width: 100%; height: auto; display: block; }
	.banner .copy { flex: 1 1 auto; }
	.banner h1 { font-size: 5.4vw; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
	.banner p { margin-top: 1.3vw; font-size: 2.1vw; opacity: 0.92; line-height: 1.35; max-width: 34vw; }
	.banner .card {
		flex: 0 0 33%;
		background: rgba(255, 255, 255, 0.96);
		color: #1d2327;
		border-radius: 1.4vw;
		padding: 2vw 2.2vw;
		box-shadow: 0 1.5vw 3vw rgba(10, 5, 40, 0.45);
	}
	.card h2 { font-size: 1.45vw; font-weight: 600; color: #50575e; margin-bottom: 1.2vw; }
	.row { display: flex; align-items: center; gap: 1vw; margin: 0.75vw 0; font-size: 1.3vw; }
	.row b { width: 32%; font-weight: 600; white-space: nowrap; }
	.row .bar { flex: 1; height: 1.1vw; border-radius: 1vw; background: #f0f0f1; overflow: hidden; }
	.row .bar i { display: block; height: 100%; border-radius: 1vw; }
	.row span { width: 12%; text-align: right; color: #50575e; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<template id="mark">
	<!-- Radar: concentric rings, a sweep and the three bot classes as blips. -->
	<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
		<defs>
			<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
				<stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
				<stop offset="1" stop-color="#fff" stop-opacity="0"/>
			</linearGradient>
		</defs>
		<circle cx="50" cy="50" r="44" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="4"/>
		<circle cx="50" cy="50" r="29" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="3"/>
		<circle cx="50" cy="50" r="14" fill="none" stroke="#fff" stroke-opacity="0.3" stroke-width="2.5"/>
		<path d="M50 50 L50 6 A44 44 0 0 1 88.1 28 Z" fill="url(#sweep)"/>
		<line x1="50" y1="50" x2="88.1" y2="28" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
		<circle cx="71" cy="21" r="6.5" fill="var(--agent)" stroke="#fff" stroke-width="2.5"/>
		<circle cx="27" cy="38" r="5.5" fill="var(--retrieval)" stroke="#fff" stroke-width="2.5"/>
		<circle cx="62" cy="74" r="5" fill="var(--training)" stroke="#fff" stroke-width="2.5"/>
		<circle cx="50" cy="50" r="5" fill="#fff"/>
	</svg>
</template>

<div class="icon" id="icon" hidden></div>

<div class="banner" id="banner" hidden>
	<div class="mark"></div>
	<div class="copy">
		<h1>GEO Insights</h1>
		<p>See which AI reads your pages – and get cited in AI answers.</p>
	</div>
	<div class="card">
		<h2>AI accesses · last 30 days</h2>
		<div class="row"><b>Agent</b><div class="bar"><i style="width:46%;background:var(--agent)"></i></div><span>412</span></div>
		<div class="row"><b>Retrieval</b><div class="bar"><i style="width:71%;background:var(--retrieval)"></i></div><span>638</span></div>
		<div class="row"><b>Training</b><div class="bar"><i style="width:94%;background:var(--training)"></i></div><span>845</span></div>
		<div class="row"><b>AI visitors</b><div class="bar"><i style="width:24%;background:var(--violet)"></i></div><span>217</span></div>
	</div>
</div>

<script>
	const asset = new URLSearchParams(location.search).get('asset') || 'banner';
	const mark = document.getElementById('mark').content;
	const target = asset === 'icon' ? document.getElementById('icon') : document.querySelector('#banner .mark');
	target.appendChild(mark.cloneNode(true));
	document.getElementById(asset === 'icon' ? 'icon' : 'banner').hidden = false;
</script>
</body>
</html>
